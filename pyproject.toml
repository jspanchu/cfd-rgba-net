[project]
name = "cfd-rgba-net"
version = "0.1.0"
description = "Learned color & opacity transfer functions for CFD flow features"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=2.1.1",
    "torch>=2.4.0",
    "numpy",
    "pandas",
    "scipy",
    "vtk==9.7.1",
    "tack-core[cpu]",
    "tack-core[cuda]; sys_platform == 'linux' or sys_platform == 'win32'",
    "tack-core[metal]; sys_platform == 'darwin'",
    "tack-vis",
]

[tool.uv.sources]
torch = { index = "pytorch-cuda", marker = "platform_system == 'Linux' or platform_system == 'Windows'" }
tack-core = { git = "https://github.com/berkgeveci/tack", subdirectory = "packages/tack-core", branch = "main" }
tack-vis = { git = "https://github.com/berkgeveci/tack", subdirectory = "packages/tack-vis", branch = "main" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.ty.environment]
python = ".venv"

[project]
name = "cfd-rgba-net"
version = "0.1.0"
description = "Learned color & opacity transfer functions for CFD flow features"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "huggingface_hub>=2.1.1",
    "torch>=2.4.0",
    "numpy",
    "pandas",
    "pyyaml",
    "scipy",
    "vtk==9.7.1",
    "zarr>=3.4.2",
    "hf-xet>=1.6.0",
]

[project.scripts]
cfd-rgba-net-build-case = "cfd_rgba_net.build_case:main"
cfd-rgba-net-batch = "cfd_rgba_net.batch:main"
cfd-rgba-net-evaluate = "cfd_rgba_net.evaluate:main"
cfd-rgba-net-infer = "cfd_rgba_net.infer:main"
cfd-rgba-net-render = "cfd_rgba_net.render:main"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8",
    "ruff>=0.17.5",
    "ty>=0.0.106",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfd_rgba_net"]

[tool.hatch.build.targets.wheel.force-include]
"configs" = "cfd_rgba_net/configs"

[tool.uv.sources]
torch = { index = "pytorch-cuda", marker = "platform_system == 'Linux' or platform_system == 'Windows'" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
# E501 is off in ruff's defaults; enable it so the limit is enforced.
extend-select = ["E501"]

[tool.ty.environment]
python = ".venv"

# Tests and scripts build arguments dynamically (``**kwargs`` dicts, zarr and
# torch internals), which ty cannot follow. Check these rules only in src/.
[[tool.ty.overrides]]
include = ["tests/**", "scripts/**"]

[tool.ty.overrides.rules]
invalid-argument-type = "ignore"
not-subscriptable = "ignore"
missing-union-attribute = "ignore"
unsupported-operator = "ignore"
not-iterable = "ignore"
no-matching-overload = "ignore"

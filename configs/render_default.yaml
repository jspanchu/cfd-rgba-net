# Defaults for cfd_rgba_net.render. Colours are RGB in [0, 1]. Pass a file with the same keys to --config.
size: [1600, 800]               # image width, height in pixels
background: [0.08, 0.08, 0.10]
body:
  color: [0.62, 0.64, 0.68]
frame:
  wake: 1.0                     # how far the view extends behind the body, in body lengths
# Path length, in voxels, over which a curve opacity applies. Larger makes the same curve more opaque.
opacity_unit_voxels: 1.5
# Per feature: colour and an opacity curve of (probability, opacity) control points, linear in between.
# Opacity is 0 below the first point and constant above the last.
features:
  vortex:
    color: [0.40, 0.10, 0.55]
    opacity: [[0.3, 0.0], [1.0, 0.85]]
  shear_layer:
    color: [0.95, 0.75, 0.20]
    opacity: [[0.3, 0.0], [1.0, 0.35]]
# The net's uncertainty, drawn alone in <out>_<view>_uncertainty.png by cfd-rgba-net-infer --method net: the
# entropy of its three class probabilities over ln 3, from 0 (certain) to 1 (all three equally likely). The
# curve starts at 0.05, about 1 % on a second class: the net is confident almost everywhere, and a curve
# starting at 0.3 left the few uncertain voxels nearly invisible. An even split between two classes is 0.63.
uncertainty:
  color: [0.85, 0.45, 0.00]
  opacity: [[0.05, 0.0], [0.63, 0.9]]

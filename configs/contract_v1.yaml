# Input contract v1.0: fixed by the model, not by the user.
# Everything here is in units of the reference length H and the freestream speed U_inf.
# There is no axis convention: the voxel grid is aligned with the mesh's own x, y, z axes, and the
# flow may run along any of them, in either sign. The model is trained to be invariant to that.
contract_version: "1.0"

# Voxel size dx = H / n_per_H.
n_per_H: 32

# Input channels, in this order. u, v, w and Cp are 0 outside the fluid.
#   u, v, w          : velocity / U_inf along the mesh's x, y, z axes
#   Cp               : 2 (p - p_inf) / (rho U_inf^2)
#   body_proximity   : max(0, 1 - sdf / (4 H)), sdf the signed distance to the body surface (negative inside):
#                      1 on the body surface, 0 at 4 H and beyond; it keeps rising inside the body (> 1), so
#                      inside vs outside is b > 1 vs b < 1. Neither a 0/1 mask nor the raw sdf is an input.
#   ground_proximity : max(0, 1 - h / H), h the height above the ground: 1 on the ground, 0 at 1 H and above
channels: [u, v, w, Cp, body_proximity, ground_proximity]

# Distance, in units of H, at which each proximity channel reaches 0 (the 4 H and 1 H above).
body_proximity_range_H: 4.0
ground_proximity_range_H: 1.0

# The signed distance to the body is exact within this distance (units of H) of the body's bounding box
# and a Euclidean distance transform beyond it, whose error is a fraction of a voxel: small against
# distances greater than the band.
sdf_exact_band_H: 1.0

# There is no box: the grid fills the dataset's domain (`domain` in configs/datasets/<name>.yaml,
# default the mesh bounds) at training, and the user's chosen region at inference. Only dx is fixed.

# Each input channel is divided by its scale before the model sees it. No mean is subtracted, so 0 stays 0.
# Computed once over the fluid voxels of the AhmedML train split (368 runs, 15,436,115,335 voxels) by
# scripts/ahmedml/compute_scales.py. u, v and w share one scale, sqrt(mean(u^2 + v^2 + w^2) / 3), so the
# 48 axis-aligned orientations, which swap and sign-flip them, leave it unchanged. Cp, body_proximity and
# ground_proximity each use their own standard deviation.
input_scales:
  velocity: 0.585942
  Cp: 0.0373487
  body_proximity: 0.202054
  ground_proximity: 0.241939
